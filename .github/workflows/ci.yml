name: Blynk Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'backend/api/**'
      - 'backend/docker-compose.yml'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/api/**'
      - 'backend/docker-compose.yml'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Lint, Typecheck, Build, Migrate & Full Automated Test Suite
  # ----------------------------------------------------------------------------
  test-and-validate:
    name: Typecheck, Build & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blynk_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blynk_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend/api

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/api/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Production TypeScript Build & Asset Bundling
        run: npm run build

      - name: Run Database Migrations (Compiled Node runner)
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/blynk_db
        run: npm run migrate:up:prod

      - name: Run Full Vitest Test Suite (Regression & Deployment Verification)
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/blynk_db
          JWT_ACCESS_SECRET: dev_jwt_access_secret_change_me_in_production_min_32_chars!
          JWT_REFRESH_SECRET: dev_jwt_refresh_secret_change_me_in_production_min_32_chars!
          OTP_SECRET: dev_otp_hmac_secret_min_32_chars_random_string!
        run: npm test

  # ----------------------------------------------------------------------------
  # Job 2: Multi-Stage Production Docker Image Build Verification
  # ----------------------------------------------------------------------------
  docker-build-test:
    name: Production Docker Build Validation
    runs-on: ubuntu-latest
    needs: test-and-validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image (Dry Run - No Push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend/api
          file: ./backend/api/Dockerfile
          push: false
          tags: blynk-backend-api:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
