server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (security audit 2026-10) on every response. nginx
    # drops these in any location that sets an add_header of its own, so
    # those locations repeat them. A full script-src Content-Security-Policy
    # is a follow-up: GTM, MapLibre and Firebase need a reviewed allow-list.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A single-page app: every route (/orders, /catalog/products/42, ...) is
    # served index.html, so refreshing or opening a deep link never 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built assets have content hashes in their names: cache them for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html must always be fresh, or a deploy is not picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
