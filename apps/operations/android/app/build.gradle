apply plugin: 'com.android.application'

// Release signing (owner, 2026-10-12): the key and its passwords live outside
// the repo in ~/.blynk-release/keystore.properties (or the file named by
// BLYNK_KEYSTORE_PROPERTIES). Without that file, release builds stay unsigned.
def releaseKeystorePropsFile = file(System.getenv('BLYNK_KEYSTORE_PROPERTIES') ?: "${System.getProperty('user.home')}/.blynk-release/keystore.properties")
def releaseKeystoreProps = new Properties()
if (releaseKeystorePropsFile.exists()) {
    releaseKeystorePropsFile.withInputStream { releaseKeystoreProps.load(it) }
}

// In-app updates (owner, 2026-10-12): the app offers an update when the
// published manifest (https://blynk.lk/download/<app>.json) has a higher
// versionCode than the installed one, so every release must increase it.
// BLYNK_VERSION_CODE wins (use it for release builds and record it in the
// manifest - docs/06-deployment/staff-app-updates.md); otherwise the number of
// commits on HEAD (always above the first shipped code, 2); else 2.
def blynkVersionCode = { ->
    def fromEnv = System.getenv('BLYNK_VERSION_CODE')?.trim()
    if (fromEnv) return fromEnv.toInteger()
    try {
        def count = providers.exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        if (count.isInteger() && count.toInteger() > 2) return count.toInteger()
    } catch (Exception ignored) {
        // No git here (e.g. a source zip): fall back below.
    }
    return 2
}()
def blynkVersionName = System.getenv('BLYNK_VERSION_NAME')?.trim() ?: "1.2"

android {
    namespace "lk.blynk.ops"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "lk.blynk.ops"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode blynkVersionCode
        versionName blynkVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseKeystorePropsFile.exists()) {
            release {
                storeFile file(releaseKeystoreProps['storeFile'])
                storePassword releaseKeystoreProps['storePassword']
                keyAlias releaseKeystoreProps['keyAlias']
                keyPassword releaseKeystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (releaseKeystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        // Wi-Fi test APK against a development backend over plain http. Its
        // network policy comes from the git-ignored src/lanTest/, generated
        // by scripts/lan-android-config.mjs (CAP_LAN_HTTP=1 + LAN_API_HOST).
        // debug and release keep the HTTPS-only policy in src/main/.
        lanTest {
            initWith debug
            matchingFallbacks = ['debug']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
