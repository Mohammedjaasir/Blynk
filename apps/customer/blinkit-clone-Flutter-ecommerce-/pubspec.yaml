name: ecom
description: A new Flutter project.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  share_plus: ^7.0.2
  package_info_plus: ^9.0.1
  provider: ^6.0.5
  flutter_secure_storage: ^8.0.0
  dio: ^5.3.0
  maplibre_gl: ^0.25.0
  google_maps_flutter: ^2.18.1
  geolocator: ^14.0.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  # Web build only (conditional import): the browser's fetch streaming and
  # EventSource for live updates. Already in the lock file via dio's web adapter.
  web: ^1.1.0
  # Website tracking (owner, 2026-10-10): the GTM user_id is a SHA-256 of the
  # customer id, never the phone or name. Already in the lock file.
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  # Test-only: the fake Google Maps platform in test/fixtures extends its base class.
  google_maps_flutter_platform_interface: ^2.17.0
  flutter_native_splash:

flutter_native_splash:
  image: Assets/splash2.png
  color: "#FFFFFF"
  ios: false
  web: false
  android_12:
    image: Assets/splash_android12.png
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"


flutter:
  uses-material-design: true
  assets:
    # Explicit on purpose: the splash source PNGs in Assets/ are only read by
    # flutter_native_splash and must not be bundled.
    - Assets/Images/
    - Assets/map/
    - .env


  fonts:
    - family: Catamaran
      fonts:
        - asset: Assets/Fonts/Catamaran-Regular.ttf
        - asset: Assets/Fonts/Catamaran-Bold.ttf
          weight: 700
        - asset: Assets/Fonts/Catamaran-ExtraBold.ttf
          weight: 800
        - asset: Assets/Fonts/Catamaran-Medium.ttf
          weight: 500
        - asset: Assets/Fonts/Catamaran-SemiBold.ttf
          weight: 600
    # Poppins (SIL Open Font License) — the geometric rounded sans the
    # reference design uses. Latin subset from Google Fonts.
    - family: Poppins
      fonts:
        - asset: Assets/Fonts/Poppins-Regular.ttf
        - asset: Assets/Fonts/Poppins-Medium.ttf
          weight: 500
        - asset: Assets/Fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: Assets/Fonts/Poppins-Bold.ttf
          weight: 700
        - asset: Assets/Fonts/Poppins-ExtraBold.ttf
          weight: 800
