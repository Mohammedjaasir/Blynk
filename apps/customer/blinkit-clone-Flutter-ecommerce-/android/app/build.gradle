plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Firebase (push notifications). app/google-services.json is git-ignored and
// lives only on the build machine (Firebase console -> Project settings ->
// Your apps -> lk.blynk.customer). Without it the google-services plugin is
// not applied: the APK still builds and runs, with push switched off (the
// app's Firebase start-up fails quietly; see lib/Services/push/).
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
} else {
    logger.warn("android/app/google-services.json is missing: this build has no push notifications")
}

// Google Maps API key, resolved in order: environment variable MAPS_API_KEY,
// android/secrets.properties, android/local.properties, else empty. Never
// printed and never committed; an empty key must not fail the build.
def mapsApiKey = {
    def fromEnv = System.getenv("MAPS_API_KEY")
    if (fromEnv != null && !fromEnv.trim().isEmpty()) return fromEnv.trim()
    for (fileName in ["secrets.properties", "local.properties"]) {
        def propsFile = rootProject.file(fileName)
        if (propsFile.exists()) {
            def props = new Properties()
            propsFile.withInputStream { props.load(it) }
            def value = props.getProperty("MAPS_API_KEY")
            if (value != null && !value.trim().isEmpty()) return value.trim()
        }
    }
    return ""
}.call()
if (mapsApiKey.isEmpty()) {
    logger.warn("MAPS_API_KEY is not set: Google Maps will show an unavailable/blank map")
}

// The website that shared product links point at (https://<host>/p/<id>),
// e.g. APP_LINK_HOST=blynk.example.com: the environment variable, else the
// Gradle property -PAPP_LINK_HOST. Android opens those links in this app once
// the site serves /.well-known/assetlinks.json for this app's signing key.
// Pass the same site to Flutter: --dart-define=SHARE_BASE_URL=https://<host>.
def appLinkHost = (System.getenv("APP_LINK_HOST") ?: (project.findProperty("APP_LINK_HOST") ?: "")).toString().trim()
if (appLinkHost.isEmpty()) {
    appLinkHost = "links.invalid"
    logger.warn("APP_LINK_HOST is not set: shared product links will open in the browser, not the app")
}

android {
    namespace = "lk.blynk.customer"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // flutter_local_notifications (foreground push display) needs it.
        coreLibraryDesugaringEnabled = true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "lk.blynk.customer"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders += [MAPS_API_KEY: mapsApiKey, APP_LINK_HOST: appLinkHost]
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
