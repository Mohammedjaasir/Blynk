<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for

    For more details:

    This is a placeholder for base href that will be replaced by the value of

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Blynk - order groceries for delivery.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Blynk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Blynk</title>
  <link rel="manifest" href="manifest.json">

  <!-- MapLibre GL JS: the maplibre_gl plugin's web implementation draws the
       tracking map and the location picker with it (maplibre_gl 0.25 README,
       "Web"). Pinned to an exact 4.x so a release can't change the map. -->
  <!-- Smoothness (owner, 2026-10-08): connect early to the API and the
       image server, and load MapLibre deferred so its ~800 KB never holds up
       the shop's first paint (defer still runs it before flutter.js). -->
  <link rel="preconnect" href="https://blynk-api.valgrowlabs.com" crossorigin>
  <link rel="preconnect" href="https://q26l1nnsapwt2baiv2uqrvhb.72.62.253.92.sslip.io" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" media="print" onload="this.media='all'">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" defer></script>

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <!-- Install helper (owner, 2026-10-08): in a phone browser - never inside
       the installed app - point at exactly what to tap to add Blynk to the
       Home Screen. Continues the walkthrough on blynk.lk. Closable; stays
       closed for this visit. Plain DOM over the Flutter view. -->
  <style>
    .bi-bar { position: fixed; left: 12px; right: 12px; bottom: 40px; z-index: 2147483000; display: none;
      align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border-radius: 16px;
      background: #12151f; color: #fff; font: 600 14px/1.35 system-ui, -apple-system, 'Segoe UI', sans-serif;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
    .bi-bar.is-top { top: 14px; bottom: auto; }
    .bi-bar img { width: 36px; height: 36px; border-radius: 9px; flex: none; }
    .bi-bar b { color: #ffe141; }
    .bi-text { flex: 1; }
    .bi-btn { border: 0; border-radius: 999px; padding: 10px 16px; background: #ffe141; color: #12151f; font: 800 14px system-ui, sans-serif; cursor: pointer; }
    .bi-x { border: 0; background: none; color: #c9cdd6; font-size: 22px; line-height: 1; padding: 4px 6px; cursor: pointer; }
    .bi-arrow { position: absolute; left: 50%; bottom: -26px; margin-left: -10px; width: 20px; height: 20px; color: #ffe141; animation: bi-bounce 1s ease-in-out infinite; }
    .bi-bar.is-top .bi-arrow { left: auto; right: 10px; bottom: auto; top: -26px; transform: rotate(180deg); animation-name: bi-bounce-up; }
    @keyframes bi-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
    @keyframes bi-bounce-up { 0%, 100% { transform: rotate(180deg) translateY(0); } 50% { transform: rotate(180deg) translateY(6px); } }
    @media (prefers-reduced-motion: reduce) { .bi-arrow { animation: none; } }
  </style>
  <div class="bi-bar" id="bi-bar" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <span class="bi-text" id="bi-text"></span>
    <button type="button" class="bi-btn" id="bi-install" hidden>Install</button>
    <button type="button" class="bi-x" id="bi-close" aria-label="Close">&times;</button>
    <svg class="bi-arrow" id="bi-arrow" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 22 3 11h6V2h6v9h6z"/></svg>
  </div>
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      var installed = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      var closed = false;
      try { closed = sessionStorage.getItem('blynk-install-helper') === 'closed'; } catch (e) {}
      if (installed || closed || !(isIOS || isAndroid)) return;
      var bar = document.getElementById('bi-bar'), text = document.getElementById('bi-text');
      var btn = document.getElementById('bi-install'), arrow = document.getElementById('bi-arrow');
      function show(html, opts) {
        text.innerHTML = html;
        btn.hidden = !opts.button;
        arrow.style.display = opts.arrow ? '' : 'none';
        bar.classList.toggle('is-top', !!opts.top);
        bar.style.display = 'flex';
      }
      document.getElementById('bi-close').addEventListener('click', function () {
        bar.style.display = 'none';
        try { sessionStorage.setItem('blynk-install-helper', 'closed'); } catch (e) {}
      });
      if (isIOS) {
        // Safari's Share button is in the bottom toolbar on iPhone.
        show('Install Blynk: tap <b>Share</b> below, then <b>Add to Home Screen</b>.', { arrow: true });
        return;
      }
      // Android adds the web app too (owner, 2026-10-08: full PWA, no APK):
      // Chrome's own Install prompt when it offers one, else point at its menu.
      var prompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        prompt = e;
        show('Get the Blynk app on your Home Screen.', { button: true });
      });
      btn.addEventListener('click', function () {
        if (!prompt) return;
        prompt.prompt();
        prompt.userChoice.then(function () { bar.style.display = 'none'; prompt = null; });
      });
      window.addEventListener('appinstalled', function () { bar.style.display = 'none'; });
      setTimeout(function () {
        if (!prompt) show('Install Blynk: tap <b>&#8942;</b> above, then <b>Install app</b>.', { arrow: true, top: true });
      }, 4000);
    })();
  </script>
  <!-- Phones only (owner, 2026-10-08: "we don't need Blynk for computer").
       On a computer the shop does not load: a page points to the phone app.
       ?desktop=1 opens the shop anyway for staff testing (this session). -->
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var phone = /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var allow = /[?&]desktop=1/.test(location.search);
      try {
        if (allow) sessionStorage.setItem('blynk-desktop', '1');
        allow = allow || sessionStorage.getItem('blynk-desktop') === '1';
      } catch (e) {}
      if (phone || allow) return;
      window.blynkDesktopGate = true;
      document.addEventListener('DOMContentLoaded', function () {
        document.body.innerHTML =
          '<style>body{margin:0;background:#fffdf5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#12151f}' +
          '.bd{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}' +
          '.bd main{max-width:420px}.bd .ic{width:84px;height:84px;border-radius:20px}' +
          '.bd h1{font-size:30px;margin:16px 0 8px;letter-spacing:-.02em}.bd p{color:#4b5364;font-size:17px;line-height:1.5;margin:0 0 20px}' +
                    '</style>' +
          '<div class="bd"><main><img class="ic" src="icons/Icon-192.png" alt="">' +
          '<h1>Blynk is a phone app</h1><p>Groceries delivered in Dharga Town and its 4 km surroundings. Open <b>blynk.lk</b> on your phone and tap <b>Get Blynk</b>.</p></main></div>';
      });
    })();
  </script>
  <!-- Android back button (owner, 2026-10-09: "back exits the app").
       Flutter keeps one browser history entry under the app and turns a back
       to it into an in-app back. Chrome on Android skips history entries a
       page added before the user touched it, so the first back skipped that
       entry and closed the app. A CloseWatcher (Chrome 120+) receives the back
       press instead; it is turned into the same in-app back (history.back()
       from script is never skipped). While the shop shows "Press back again
       to exit", the app lifts the watcher so that press really leaves. -->
  <script>
    (function () {
      if (!('CloseWatcher' in window)) return;
      var watcher = null;
      var exitArmed = false;
      function arm() {
        if (watcher || exitArmed) return;
        try { watcher = new CloseWatcher(); } catch (e) { return; }
        watcher.onclose = function () {
          watcher = null;
          history.back();
          setTimeout(arm, 50);
        };
      }
      window.blynkBackGuard = {
        setExitArmed: function (on) {
          exitArmed = !!on;
          if (exitArmed && watcher) {
            var w = watcher;
            watcher = null;
            w.onclose = null;
            w.destroy();
          }
          if (!exitArmed) arm();
        }
      };
      arm();
      document.addEventListener('pointerdown', arm, true);
    })();
  </script>
  <script>
    // Start as soon as the page is parsed (flutter.js is deferred, so it is
    // ready by then), not at 'load', which also waits for every image and
    // stylesheet (smoothness, owner 2026-10-08).
    document.addEventListener('DOMContentLoaded', function(ev) {
      if (window.blynkDesktopGate) return; // a computer: see the gate above
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
