server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A types block here replaces nginx's defaults, so bring them back in first.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
        application/vnd.android.package-archive apk;
    }

    # The landing page. Unknown paths come back to it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Android App Links: lets the Blynk app open shared product links itself.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # A shared product (https://<site>/p/<id>) without the app installed:
    # open it in the web shop.
    location ~ "^/p/([A-Za-z0-9_-]{1,64})/?$" {
        return 302 /app/#/p/$1;
    }

    # The installable shop (Flutter web app, built with --base-href /app/).
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }
    # Always fresh, so a redeploy reaches installed home-screen apps.
    location ~ ^/app/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|manifest\.json|version\.json)$ {
        add_header Cache-Control "no-cache";
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # The Android app, from the mounted volume.
    location /download/ {
        add_header Content-Disposition "attachment";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm;
}
