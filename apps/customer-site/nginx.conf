server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A types block here replaces nginx's defaults, so bring them back in first.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
        application/vnd.android.package-archive apk;
    }

    # The landing page. Unknown paths come back to it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Android App Links: lets the Blynk app open shared product links itself.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # A shared product (https://<site>/p/<id>) without the app installed:
    # open it in the web shop.
    location ~ "^/p/([A-Za-z0-9_-]{1,64})/?$" {
        return 302 /app/#/p/$1;
    }

    # The installable shop (Flutter web app, built with --base-href /app/).
    # Flutter's files keep the same names on every build (main.dart.js,
    # assets/...), so everything here is revalidated on each load: a redeploy
    # reaches browsers and home-screen apps at once (a 304 costs nothing).
    # Without this, browsers and Cloudflare kept main.dart.js for 4 hours and
    # customers saw the old shop after an update (2026-10-07).
    location /app/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /app/index.html;
    }
    # The Flutter engine (CanvasKit) only changes with a Flutter upgrade.
    location /app/canvaskit/ {
        add_header Cache-Control "public, max-age=604800";
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # The Android apps (https://<site>/download/blynk.apk, rider.apk, ops.apk):
    # a file in the mounted volume wins, else the copy built into the image
    # (/files/, from apps/customer-site/files). Always revalidated, so a new
    # APK is downloaded straight after a redeploy.
    location ~ ^/download/([A-Za-z0-9._-]+\.apk)$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
        try_files /download/$1 /files/$1 =404;
    }
    location /files/ { internal; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm;
}
