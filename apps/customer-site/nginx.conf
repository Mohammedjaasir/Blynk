server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # text/html, text/plain, text/xml and JavaScript are sent as UTF-8 (the
    # Sinhala and Tamil pages need it; nginx's default charset_types).
    charset utf-8;

    # Security headers (security audit 2026-10) on every response. nginx
    # drops these in any location that sets an add_header of its own, so
    # those locations repeat them. A full script-src Content-Security-Policy
    # is a follow-up: GTM, MapLibre and Firebase need a reviewed allow-list.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A types block here replaces nginx's defaults, so bring them back in first.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    # The landing page. Unknown paths come back to it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Legal pages (owner, 2026-10-14): /privacy, /terms and /refunds (a
    # trailing slash works too) serve privacy.html, terms.html, refunds.html.
    # Revalidated on every load like the landing page, so an update to the
    # text reaches everyone at once.
    location ~ "^/(privacy|terms|refunds)/?$" {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /$1.html =404;
    }

    # SEO pages (owner's SEO brief, 2026-10-15): /dharga-town, /aluthgama,
    # /si/, /ta/aluthgama ... serve <name>/index.html, with or without a
    # trailing slash (each page's canonical link names the slashless form).
    # /app is left to the shop below. Any other single name still falls back
    # to the landing page, as before.
    location ~ "^/(?!app/?$)((?:si/|ta/)?[a-z0-9-]+)/?$" {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /$1/index.html /index.html;
    }

    # For search engines: text/plain and text/xml (nginx's mime.types).
    location = /robots.txt {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /sitemap.xml {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Android App Links: lets the Blynk app open shared product links itself.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # A shared product (https://<site>/p/<id>) without the app installed:
    # open it in the web shop.
    location ~ "^/p/([A-Za-z0-9_-]{1,64})/?$" {
        return 302 /app/#/p/$1;
    }

    # The installable shop (Flutter web app, built with --base-href /app/).
    # Flutter's files keep the same names on every build (main.dart.js,
    # assets/...), so everything here is revalidated on each load: a redeploy
    # reaches browsers and home-screen apps at once (a 304 costs nothing).
    # Without this, browsers and Cloudflare kept main.dart.js for 4 hours and
    # customers saw the old shop after an update (2026-10-07).
    location /app/ {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /app/index.html;
    }
    # The Flutter engine (CanvasKit) only changes with a Flutter upgrade.
    location /app/canvaskit/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # PWA web push worker (Firebase looks for it at the site root).
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The staff Android apps are no longer public (owner, 2026-10-12): the
    # old /download/<app>.apk and /download/<app>.json are closed. The API
    # serves Blynk Ops / Blynk Rider only to signed-in staff, or through a
    # temporary share link switched on in Admin / Ops
    # (docs/06-deployment/staff-app-updates.md). A plain 404 here, never the
    # landing page, so an old link or an old app's update check fails cleanly.
    location ^~ /download/ {
        return 404;
    }
    location = /download {
        return 404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm;
}
