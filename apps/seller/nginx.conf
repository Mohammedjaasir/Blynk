server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (security audit 2026-10) on every response. nginx
    # drops these in any location that sets an add_header of its own, so
    # those locations repeat them. A full script-src Content-Security-Policy
    # is a follow-up: GTM, MapLibre and Firebase need a reviewed allow-list.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # nginx's default mime.types already has png, js and json; the web app
    # manifest needs its own type. A types block replaces the defaults, so
    # bring them back in first.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    # A single-page app: every route (/products, /products/42, ...) is
    # served index.html, so refreshing or opening a deep link never 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built assets have content hashes in their names: cache them for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html must always be fresh, or a deploy is not picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Installable app (PWA): the push service worker must sit at the site root
    # (Firebase looks for /firebase-messaging-sw.js) and, like the manifest,
    # is revalidated on every load, or a fixed worker or a renamed icon would
    # reach phones days late. A missing file is a 404, never the app page.
    location = /firebase-messaging-sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
    # App icons: not hashed, so a day, not a year.
    location /icons/ {
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
}
