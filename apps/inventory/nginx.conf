server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A single-page app: every route (/orders, /catalog/products/42, ...) is
    # served index.html, so refreshing or opening a deep link never 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built assets have content hashes in their names: cache them for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be fresh, or a deploy is not picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
